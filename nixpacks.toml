[phases.setup]
nixPkgs = ["nodejs_22", "pnpm-9_x", "openssl"]

[phases.install]
cmd = "npm install -g corepack@0.24.1 && corepack enable && pnpm install --no-frozen-lockfile"

[phases.build]
cmd = "npx turbo run build"

[start]
cmd = "cd apps/mail && npx wrangler dev --port 3000 --host 0.0.0.0 --show-interactive-dev-session=false"
